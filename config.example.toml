# Copy to config.toml. All file paths are relative to this configuration file.
[project]
timezone = "America/Lima"
start_date = "2026-10-06"
database = "data/pilot.sqlite3"

[alma]
# Choose the API host for your institutional region (NA, EU, AP, etc.).
base_url = "https://api-na.hosted.exlibrisgroup.com"
api_key_env = "ALMA_API_KEY" # Nombre de variable en .env; el valor secreto no va aquí.
page_size = 1000
max_pages = 10000

[alma.prestamos]
report_path = "/shared/REPLACE_INSTITUTION/Pilot/Loans"
date_column = '"Loan Date"."Loan Date"'
# Orden verificado para el reporte Loans actual de esta institución.
# Si cambia el análisis, inspecciona de nuevo antes de modificar ColumnN.
[alma.prestamos.fields]
source_user_email = "Column19"
# Mapeo verificado de Loans sin fórmulas de usuario ni correo.
loan_id = "Column12"
activity_date = "Column8"
user_id = "Column1"
resource_id = "Column11"
resource_name = "Column17"
site = "Column3"
site_id = "Column2"
status = "Column13"
in_house_loan_indicator = "Column10"
source_updated_at = ""
source_available_at = ""

[alma.renovaciones]
report_path = "/shared/REPLACE_INSTITUTION/Pilot/Renewals"
date_column = '"Renewal Date"."Renewal Date"'
[alma.renovaciones.fields]
source_user_email = "Column10"
# Mapeo verificado de Renewals; clave: préstamo + fecha + campus.
loan_id = "Column4"
activity_date = "Column13"
user_id = "Column1"
resource_id = "Column3"
resource_name = "Column8"
site = "Column12"
site_id = "Column11"
status = "Column5"
quantity = "Column14"
source_updated_at = ""
source_available_at = ""

[libcal]
base_url = "https://REPLACE_INSTITUTION.libcal.com"
token_path = "/1.1/oauth/token"
bookings_path = "/1.1/space/bookings"
client_id_env = "LIBCAL_CLIENT_ID" # Nombre de variable en .env; el valor secreto no va aquí.
client_secret_env = "LIBCAL_CLIENT_SECRET" # Nombre de variable en .env; el valor secreto no va aquí.
# Based on docs/1_1.yml. Validate actual responses and category IDs.
# /space/bookings ignores past dates; historical backfill needs another source.
response_path = "" # Empty for root arrays; e.g. "bookings" for wrapped responses.
pagination = "page"
page_start = 1
page_size = 100
window_days = 1
max_pages = 10000

[libcal.query]
lid = "{location_id}"
date = "{date}"
days = "{days}"
cid = "{category_id}"
limit = "{limit}"
page = "{page}"
form_answers = 1
include_cancel = 1
include_tentative = 1
include_denied = 1
# If the API takes an end date, use its parameter name with "{end_date}".
# Add documented static parameters here if required to include cancellations.

[libcal.fields]
seat_id = "seat_id"
seat_name = "seat_name"
source_user_email = "email"
booking_id = "bookId"
starts_at = "fromDate"
ends_at = "toDate"
resource_id = "eid"
resource_name = "item_name"
site = "location_name"
site_id = "lid"
status = "status"
# Optional if the response includes category ID; enables filter verification.
category_id = "cid"
# Configure the actual institutional code field, not an email fallback.
# Dotted paths support nested objects and array indices, e.g. answers.0.value.
user_id = "" # No verified institutional ID yet; do not use email as a substitute.
check_in = "" # Map only if an ISO timestamp is available.
check_out = ""

